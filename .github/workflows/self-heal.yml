name: Self-Heal on Failure
on:
  workflow_run:
    workflows: ["Test Pipeline"]
    types: [completed]

jobs:
  heal:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: NyuydineBill/self-healing-cicd@v0.1.5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allowed-path-prefixes: 'tests/,app/'